name: Ion Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      id-token: write       # OIDC: npm trusted publishing + provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10
      - name: Update npm
        run: npm install -g npm@latest

      # Deterministic install: respects package-lock.json, faster in CI,
      # never updates the lock file as a side effect
      - name: Install dependencies
        run: npm ci

      # Fail fast on type errors before spending time building
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Align package.json version with the GitHub release tag (e.g. v1.2.3)
      # The tag is available as github.ref_name on a release event
      - name: Sync version from release tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"          # strip leading "v" if present
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build
        run: npm run build

      # Verify the dist actually exists before trying to publish
      - name: Verify dist output
        run: |
          if [ ! -f dist/index.js ] || [ ! -f dist/index.cjs ] || [ ! -f dist/index.global.js ]; then
            echo "::error::Expected dist files not found. Build may have failed silently."
            exit 1
          fi

      # No token: npm authenticates through the trusted publisher configured
      # for this repository and workflow on npmjs.com (OIDC, id-token above)
      - name: Publish to npm
        run: npm publish --access public --provenance
